name: Portable runtime and application
on: [push, pull_request, workflow_dispatch]
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        profile: [runtime, application]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux application dependencies
        if: runner.os == 'Linux' && matrix.profile == 'application'
        run: sudo apt-get update && sudo apt-get install --yes libncurses-dev libasound2-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libegl1-mesa-dev libgl1-mesa-dri xvfb libxtst6 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 dbus-x11
      - name: Fetch hash-verified archived PMStars fixture
        if: runner.os == 'Linux' && matrix.profile == 'application'
        run: python3 tests/integration/fetch_gui_fixture.py --destination "$RUNNER_TEMP/hobbes"
      - name: Fetch pinned Unicorn source
        shell: bash
        run: |
          git init _deps/unicorn
          git -C _deps/unicorn remote add origin https://github.com/unicorn-engine/unicorn.git
          git -C _deps/unicorn fetch --depth=1 origin 8028ec436f2d9376525352dd38ed9ed6b9f6be10
          git -C _deps/unicorn checkout --detach FETCH_HEAD
      - name: Configure
        shell: bash
        run: |
          gui_args=()
          if [ "$RUNNER_OS" = Linux ] && [ "${{ matrix.profile }}" = application ]; then
            gui_args=(-DTWOINE_PMSTARS_EXE="$RUNNER_TEMP/hobbes/PMStars.exe" -DTWOINE_OPENGL=ON)
          fi
          runtime_only=OFF
          if [ "${{ matrix.profile }}" = runtime ]; then runtime_only=ON; fi
          cmake -S . -B build-runtime -DTWOINE_RUNTIME_ONLY="$runtime_only" -DTWOINE_PORTABLE_LOADER=ON -DCMAKE_BUILD_TYPE=Release -DTWOINE_UNICORN_SOURCE_DIR="$PWD/_deps/unicorn" "${gui_args[@]}"
      - name: Build
        run: cmake --build build-runtime --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build-runtime -C Release --output-on-failure
      - name: Test native GNOME bottle manager
        if: runner.os == 'Linux' && matrix.profile == 'application'
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/integration/gnome_bottles.py --build build-runtime
      - name: Retain GUI failure evidence
        if: failure() && runner.os == 'Linux' && matrix.profile == 'application'
        uses: actions/upload-artifact@v4
        with:
          name: portable-gui-failure
          path: build-runtime/gui-results/
