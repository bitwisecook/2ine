name: Portable runtime and application
on: [push, pull_request, workflow_dispatch]
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
        profile: [runtime, application]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux archive dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libarchive-dev
      - name: Install Linux application dependencies
        if: runner.os == 'Linux' && matrix.profile == 'application'
        run: sudo apt-get update && sudo apt-get install --yes libglib2.0-dev libsndfile1-dev libncurses-dev libasound2-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libegl1-mesa-dev libgl1-mesa-dri xvfb libxtst6 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 dbus-x11 patchelf rpm desktop-file-utils appstream
      - name: Install Mac application synthesis dependencies
        if: runner.os == 'macOS' && matrix.profile == 'application'
        run: brew install glib libsndfile pkgconf
      - name: Fetch hash-verified archived PMStars fixture
        if: runner.os == 'Linux' && matrix.profile == 'application'
        run: python3 tests/integration/fetch_gui_fixture.py --destination "$RUNNER_TEMP/hobbes"
      - name: Fetch pinned Unicorn source
        shell: bash
        run: |
          git init _deps/unicorn
          git -C _deps/unicorn remote add origin https://github.com/unicorn-engine/unicorn.git
          git -C _deps/unicorn fetch --depth=1 origin 8028ec436f2d9376525352dd38ed9ed6b9f6be10
          git -C _deps/unicorn checkout --detach FETCH_HEAD
      - name: Configure
        shell: bash
        run: |
          gui_args=()
          if [ "$RUNNER_OS" = Linux ] && [ "${{ matrix.profile }}" = application ]; then
            gui_args=(-DTWOINE_PMSTARS_EXE="$RUNNER_TEMP/hobbes/PMStars.exe" -DTWOINE_OPENGL=ON)
          fi
          runtime_only=OFF
          if [ "${{ matrix.profile }}" = runtime ]; then runtime_only=ON; fi
          cmake -S . -B build-runtime -DTWOINE_RUNTIME_ONLY="$runtime_only" -DTWOINE_PORTABLE_LOADER=ON -DCMAKE_BUILD_TYPE=Release -DTWOINE_UNICORN_SOURCE_DIR="$PWD/_deps/unicorn" "${gui_args[@]}"
      - name: Build
        run: cmake --build build-runtime --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build-runtime -C Release --output-on-failure
      - name: Test native GNOME ball manager
        if: runner.os == 'Linux' && matrix.profile == 'application'
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 tests/integration/gnome_ball.py --build build-runtime
      - name: Test native GNOME drive and application editors
        if: runner.os == 'Linux' && matrix.profile == 'application'
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 tests/integration/gnome_features.py --build build-runtime
      - name: Test native bank import, channel mapping and source credits
        if: runner.os == 'Linux' && matrix.profile == 'application'
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 tests/integration/gnome_audio.py --build build-runtime
      - name: Validate GNOME metadata and build native packages
        if: runner.os == 'Linux' && matrix.profile == 'application'
        run: |
          desktop-file-validate tools/gnome/*.desktop
          appstreamcli validate --no-net tools/gnome/*.metainfo.xml
          python3 tools/build_gnome_packages.py --build build-runtime
      - name: Test relocated Debian package
        if: runner.os == 'Linux' && matrix.profile == 'application'
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 tests/integration/gnome_package.py build-gnome/packages/*.deb
      - name: Upload native Linux packages
        if: runner.os == 'Linux' && matrix.profile == 'application'
        uses: actions/upload-artifact@v4
        with:
          name: gnome-packages
          path: |
            build-gnome/packages/*.deb
            build-gnome/packages/*.rpm
      - name: Retain GUI failure evidence
        if: failure() && runner.os == 'Linux' && matrix.profile == 'application'
        uses: actions/upload-artifact@v4
        with:
          name: portable-gui-failure
          path: build-runtime/gui-results/

  gnome51:
    needs: runtime
    runs-on: ubuntu-26.04
    container: fedora:45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gnome-packages
          path: packages
      - name: Install RPM on GNOME 51 libraries
        run: dnf install -y packages/*.rpm mesa-dri-drivers xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon patchelf cpio
      - name: Exercise installed frontend and relocated RPM
        run: xvfb-run -a dbus-run-session -- python3 tests/integration/gnome_package.py packages/*.rpm
