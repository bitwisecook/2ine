name: GNOME Snap
on:
  pull_request:
    paths:
      - 'snap/**'
      - 'apps/gnome/**'
      - 'apps/common/**'
      - 'VERSION'
      - 'tools/codegen/project_sources.py'
      - 'tools/codegen/data/**'
      - 'docs/project-sources.md'
      - 'docs/licenses/**'
      - 'ball/**'
      - 'cmake/**'
      - 'os2/mm/midi/**'
      - 'tools/ball/**'
      - '.github/workflows/gnome-snap.yml'

  workflow_dispatch:
jobs:
  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build strict core26 GNOME Snap
        id: snapcraft
        uses: canonical/action-build@v1
        with:
          snapcraft-args: pack --platform amd64
      - name: Diagnose Snap setup or build failure
        if: failure()
        run: |
          sudo snap debug connectivity || true
          sudo journalctl --unit snapd --no-pager --lines 100
      - uses: actions/upload-artifact@v4
        with:
          name: gnome-snap
          path: ${{ steps.snapcraft.outputs.snap }}
