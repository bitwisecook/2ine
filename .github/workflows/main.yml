name: Native Linux application
on: [push, pull_request, workflow_dispatch]
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install i386 development dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build gcc-multilib libc6-dev-i386 libncurses-dev libncurses-dev:i386 libasound2-dev:i386 libx11-dev:i386 libxext-dev:i386 libxcursor-dev:i386 libxi-dev:i386 libxrandr-dev:i386 libxss-dev:i386
      - name: Configure native worker and pinned SDL3 source
        run: cmake -S . -B build-native -GNinja -DCMAKE_BUILD_TYPE=Release -DTWOINE_PORTABLE_LOADER=OFF
      - name: Build
        run: cmake --build build-native --parallel 2
      - name: Test native execution boundary
        run: ctest --test-dir build-native --output-on-failure
